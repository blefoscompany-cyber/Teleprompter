name: Teleprompter
options:
  bundleIdPrefix: local.teleprompter
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Teleprompter:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        excludes:
          - Info.plist
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Teleprompter
        NSCameraUsageDescription: Show your camera and record videos while you read your script.
        NSMicrophoneUsageDescription: Record your voice together with the camera video.
        NSPhotoLibraryAddUsageDescription: Save your finished recordings to Apple Photos.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: local.teleprompter.camera
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TeleprompterTests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests
    dependencies:
      - target: Teleprompter
schemes:
  Teleprompter:
    build:
      targets:
        Teleprompter: all
    test:
      targets:
        - TeleprompterTests
